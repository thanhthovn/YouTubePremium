<script>
  window.addEventListener('DOMContentLoaded', () => {
    // 1. Kiểm tra tham số từ URL
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.get('fullscreen') === 'true') {
      // 2. Tạo lớp phủ (Overlay) thông báo
      const overlay = document.createElement('div');
      overlay.innerText = 'Click vào bất kỳ đâu để bật Toàn màn hình 🚀';
      
      // Định kiểu giao diện cho lớp phủ
      Object.assign(overlay.style, {
        position: 'fixed',
        top: '0',
        left: '0',
        width: '100vw',
        height: '100vh',
        backgroundColor: 'rgba(0, 0, 0, 0.85)',
        color: '#ffffff',
        display: 'flex',
        justifyContent: 'center',
        alignItems: 'center',
        fontSize: '22px',
        fontWeight: 'bold',
        zIndex: '99999',
        cursor: 'pointer',
        userSelect: 'none',
        transition: 'opacity 0.3s ease'
      });

      document.body.appendChild(overlay);

      // 3. Bật Fullscreen khi người dùng chạm/click vào lớp phủ
      overlay.addEventListener('click', () => {
        const docEl = document.documentElement;

        // Hỗ trợ đầy đủ các trình duyệt khác nhau
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) { /* Safari */
          docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) { /* IE11 */
          docEl.msRequestFullscreen();
        }

        // Làm mờ và xóa lớp phủ sau khi kích hoạt
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 300);
      });
    }
  });
</script>
